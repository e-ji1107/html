<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Portfolio</title>
    <!-- Web Font: Noto Sans KR -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        height: 390vh;
        font-family: "Noto Sans KR", sans-serif;
        background-color: #f4f4f4;
        color: #333;
      }

      section {
        height: 95vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        font-weight: bold;
        transition: background-color 0.5s ease;
      }

      section:nth-of-type(odd) {
        background-color: #e8f0fe;
        color: #1a73e8;
      }

      section:nth-of-type(even) {
        background-color: #ffffff;
        color: #5f6368;
      }

      .scroll-text {
        position: fixed;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.5rem;
        font-weight: 700;
        background-color: white;
        color: #1a1a1a;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        padding: 15px 25px;
        border-radius: 30px;
        z-index: 999;
        transition: all 0.3s ease;
      }

      .left-menu,
      .right-menu {
        position: fixed;
        top: 100px;
        opacity: 0;
        transition: 0.6s ease;
        border-radius: 10px;
        padding: 20px;
        color: #fff;
      }

      .left-menu {
        left: -250px;
        background-color: #4a90e2;
        width: 180px;
      }

      .right-menu {
        right: -250px;
        background-color: #f57c00;
        width: 220px;
      }

      .end-line {
        display: flex;
        justify-content: center;
      }

      .end-menu {
        position: fixed;
        bottom: -100px;
        font-size: 1.8rem;
        color: white;
        background-color: #e53935;
        padding: 15px 30px;
        border-radius: 50px;
        transition: all 0.5s ease;
        opacity: 0;
      }

      .show-left {
        left: 20px;
        opacity: 1;
      }

      .show-right {
        right: 20px;
        opacity: 1;
      }

      .show-end {
        bottom: 50px;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="scroll-text" id="scrollText">스크롤을 내려주세요.</div>

    <div class="left-menu" id="leftMenu">
      왼쪽 메뉴
      <ol>
        <li>소개</li>
        <li>기술</li>
        <li>프로젝트</li>
        <li>연락처</li>
      </ol>
    </div>

    <div class="right-menu" id="rightMenu">
      오른쪽 메뉴
      <ul>
        <li>Team Work</li>
        <li>GitHub</li>
        <li>Blog</li>
        <li>Resume</li>
      </ul>
    </div>

    <div class="end-line">
      <div class="end-menu" id="endMenu">감사합니다!</div>
    </div>

    <section>1단계</section>
    <section>2단계</section>
    <section>3단계</section>
    <section>4단계</section>
    <section>End</section>

    <script>
      const scrollText = document.getElementById("scrollText");
      const leftMenu = document.getElementById("leftMenu");
      const rightMenu = document.getElementById("rightMenu");
      const endMenu = document.getElementById("endMenu");
      let once = false;

      window.addEventListener("scroll", () => {
        const scrollY = window.scrollY;

        if (scrollY < 900) {
          scrollText.textContent = `아래로 스크롤을 내려보세요`;
        } else if (scrollY < 1700) {
          scrollText.textContent = `지금은 2단계입니다 / ${scrollY}px`;
        } else if (scrollY < 2500) {
          scrollText.textContent = `지금은 3단계입니다 / ${scrollY}px`;
        } else if (scrollY < 3200) {
          scrollText.textContent = `지금은 4단계입니다 / ${scrollY}px`;
        } else if (scrollY < 3400) {
          scrollText.textContent = `마지막 구간입니다 / ${scrollY}px`;
        }

        // 왼쪽 메뉴
        if (scrollY > 500 && scrollY < 1500) {
          leftMenu.classList.add("show-left");
        } else {
          leftMenu.classList.remove("show-left");
        }

        // 오른쪽 메뉴
        if (scrollY > 1400 && scrollY < 2600) {
          rightMenu.classList.add("show-right");
        } else {
          rightMenu.classList.remove("show-right");
        }

        // 마지막 인사
        if (scrollY > 3500 && !once) {
          once = true;
          scrollText.textContent = `처음으로 갈게요~ 잡으세요! / ${scrollY}px`;
          endMenu.classList.add("show-end");
          setTimeout(() => {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }, 2000);
        } else if (scrollY <= 2800) {
          once = false;
          endMenu.classList.remove("show-end");
        }
      });
    </script>
  </body>
</html>
